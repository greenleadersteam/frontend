<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="application-name" content="Московские посадки" />
    <meta
      name="description"
      content="Автоматическое проектирование озеленения по подоснове DXF с нормативными отступами и обоснованием каждой посадки"
    />
    <title>Московские посадки</title>
    <!--
      Экран загрузки и экран ошибки старта (src/main.tsx, showStartupError) показываются до
      загрузки темы и CSS приложения. Это единственное место вне темы: цвета — литералы палитры «Лён и шалфей»
      (.claude/rules/design.md): фон stone.1, текст stone.9, вторичный stone.7, кнопка sage.7.
      Шрифт системный: Mulish ещё не загружен. style-src 'unsafe-inline' в CSP уже разрешён.
    -->
    <style>
      .startup-error {
        position: fixed;
        inset: 0;
        display: grid;
        align-content: center;
        justify-items: start;
        gap: 16px;
        padding: 24px max(24px, calc((100vw - 640px) / 2));
        background: #f4f2ee;
        color: #2e2a27;
        font:
          15px/1.55 system-ui,
          sans-serif;
      }
      .startup-error p {
        margin: 0;
      }
      .startup-error small {
        color: #6f6862;
        font-size: 13px;
      }
      .startup-error button {
        padding: 8px 16px;
        border: 0;
        border-radius: 10px;
        background: #5f6b55;
        color: #fff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      .startup-error button:hover {
        background: #48523f;
      }
      .startup-error button:focus-visible {
        outline: 2px solid #5f6b55;
        outline-offset: 2px;
      }
      /* Загрузка до старта React (конфиг и чанки приложения): по центру экрана, через 200 мс —
         быстрые загрузки не мигают. Кольцо — дорожка stone.2 и заполнение sage.7, как у Loader. */
      .startup-loader {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #f4f2ee;
        animation: startup-appear 0ms 200ms both;
      }
      .startup-loader span {
        width: 36px;
        height: 36px;
        box-sizing: border-box;
        border: 3px solid #ece6dd;
        border-top-color: #5f6b55;
        border-radius: 50%;
        animation: startup-spin 0.8s linear infinite;
      }
      .startup-loader small {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
      }
      @keyframes startup-appear {
        from {
          opacity: 0;
        }
      }
      @keyframes startup-spin {
        to {
          transform: rotate(1turn);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .startup-loader span {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <noscript>Для работы приложения нужен JavaScript. Включите его в настройках браузера.</noscript>
    <div id="root">
      <div class="startup-loader" role="status" aria-live="polite">
        <span></span><small>Загружаем…</small>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
