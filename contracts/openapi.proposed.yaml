openapi: 3.1.0
info:
  title: greenplan API — контракт-предложение фронтенда
  version: 0.1.0-proposed
  description: |
    Эндпоинты и схемы, которых фронтенду не хватает в текущем API (коммит бэкенда 7223e2e).
    Здесь только новое и изменённое. Неизменные схемы подключены ссылкой на задеплоенную
    спецификацию https://backend.greenleaders.online/openapi.json.

    Принцип — только добавочные изменения. Существующие ответы не меняются: новые данные
    приходят новыми эндпоинтами или необязательными полями, а у объектов допустимы лишние
    свойства. Клиент, написанный под текущий API, продолжает работать; фронтенд подхватывает
    новое, когда оно появится.

    У каждой новой функции есть имя возможности (`serverCapabilities` в runtime-конфиге
    фронтенда). Фронтенд не угадывает, что умеет сервер, по ответам 404: администратор контура
    перечисляет реализованные возможности, и только они включаются в интерфейсе.

    | Возможность | Что реализовать |
    |---|---|
    | `obstacles` | `GET /projects/{project_id}/obstacles` |
    | `rejected` | `GET /projects/{project_id}/rejected` |
    | `norms` | `GET /norms` |
    | `explanationChecks` | `checks` в `/explanation` |
    | `species` | `GET /species`, `species_id` и `species_reason_ru` у посадки |
    | `plantingEdits` | версии плана посадок: `GET /projects/{project_id}/plantings`, `GET` и `POST …/plantings/{version}/edit` |
    | `editedDxf` | `/dxf?version={version}` |
    | `runs` | `POST /projects/{project_id}/runs` |
    | `manualGeoreference` | `PUT /projects/{project_id}/georeference` |
    | `optionalBbox` | создание проекта без `bbox_user` |

    Что предлагается:
    - `GET /projects/{project_id}/obstacles` — главная просьба: распознанные объекты подосновы
      в той же системе координат, что `/zones` (источник — `processed/parsed.geojson`, который
      бэкенд уже пишет). По ним фронтенд считает точное расстояние от ствола до объекта
      для каждой проверки;
    - `GET /projects/{project_id}/explanation` — формат прежний, у элемента необязательное
      поле `checks` с расстояниями, посчитанными бэкендом;
    - `GET /projects/{project_id}/rejected` — места-кандидаты, отклонённые из-за отступа;
    - `GET /norms` — справочник норм из `norms/default.yaml` с пунктами нормативных актов;
    - `GET /species` — справочник пород; у посадки добавочно порода и причина выбора;
    - версии плана посадок (модель бэкенд-разработчика): список версий, версия целиком и правка
      версии, которая создаёт новую; `/dxf?version=`;
    - `PUT /projects/{project_id}/georeference` — готовые параметры привязки от клиента;
    - `POST /projects/{project_id}/runs` — повторная обработка загруженного архива с параметрами;
    - `GET /processing-defaults` — параметры обработки по умолчанию и допустимые диапазоны;
    - перечисления для `status`, `job.stage`; необязательный `bbox_user`; лимиты длины
      `name` и `description`; тело и коды ответов
      `upload`; файл в ответе `dxf`; схемы ответов `zones` и `planting` (описывают текущий вывод
      бэкенда, формат не меняется);
    - `ErrorResponse` для всех ошибок, кроме 422.

    Когда эндпоинт реализован, фронтенд удаляет его из этого файла и берёт типы из основной
    спецификации.

    Решения бэкенд-разработчика (28.09.2026), фронтенд их не оспаривает:
    - геопривязка обязательна: проект, упавший на ней, считается сломанным;
    - `bbox_user` остаётся обязательным — возможности `optionalBbox` на сервере не будет;
    - `parsed.geojson` до геопривязки не пишется: у упавшего на геопривязке проекта
      `/obstacles` — 404;
    - `PUT /georeference` и работа без сети — следующая версия;
    - `/obstacles`, `/norms`, имя файла в `/dxf` и пункты норм — «если успеет», включаются
      конфигом; сети распознаются неточно, поэтому основной путь проверок — зоны запрета;
    - версии плана посадок — модель бэкенд-разработчика; здесь она с дополнениями фронтенда.

paths:
  /projects:
    post:
      summary: Создать проект
      description: |
        Изменения — у `name` и `description` появились ограничения длины (см.
        `ProjectCreateRequest`). Необязательный `bbox_user` (возможность `optionalBbox`)
        бэкенд-разработчик решил не делать: поле остаётся обязательным.
      operationId: create_project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectCreateRequest'
      responses:
        '201':
          description: Проект создан, статус `draft`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        '422':
          $ref: '#/components/responses/ValidationError'

  /projects/{project_id}/upload:
    post:
      summary: Загрузить архив и запустить обработку
      description: |
        Тело — сырые байты ZIP-архива, не multipart. Допустимо из статусов `draft` и `failed`.
        Лимит размера — `GREENPLAN_API_MAX_UPLOAD_MB` в МиБ: по умолчанию в коде 300 МиБ
        (314 572 800 байт); в docker-compose бэкенда до 7223e2e было 100 МиБ (104 857 600 байт),
        теперь compose лежит в общем репозитории ci, значение не сверено. Клиент по ТЗ
        ограничивает архив 100 МиБ независимо от сервера.
      operationId: upload_project
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: X-Upload-Filename
          in: header
          required: false
          description: |
            Исходное имя файла, закодированное `encodeURIComponent` (заголовок допускает только
            ASCII). Бэкенд может его не читать; сейчас его использует только мок фронтенда
            для детерминированных сценариев.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/zip:
            schema:
              type: string
              format: binary
      responses:
        '202':
          description: Архив принят, статус `queued`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        '400':
          description: Пустое тело.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/ProjectNotFound'
        '409':
          description: Статус проекта не позволяет загрузку (не `draft` и не `failed`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: |
            Архив больше лимита сервера: размер тела больше `GREENPLAN_API_MAX_UPLOAD_MB` · 2²⁰ байт
            (300 МиБ по умолчанию; значение в docker-compose репозитория ci не сверено). Бэкенд обрывает приём посреди потока,
            поэтому клиент может получить обрыв соединения вместо ответа 413.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/TooManyJobs'

  /projects/{project_id}/runs:
    post:
      summary: Повторить обработку с параметрами
      description: |
        Перезапускает обработку уже загруженного архива. Результат прошлой обработки заменяется.
        Исходный архив не меняется. Все поля тела необязательны: пустой объект — повтор
        с параметрами по умолчанию (`GET /processing-defaults`).
      operationId: run_project
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunRequest'
      responses:
        '202':
          description: Перезапуск принят, статус `queued`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        '404':
          $ref: '#/components/responses/ProjectNotFound'
        '409':
          description: Статус не `ready` и не `failed`, или архив ещё не загружен.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyJobs'

  /projects/{project_id}/explanation:
    get:
      summary: Обоснование посадок
      description: |
        Формат прежний — массив `[{id, plant_type, rule_id, rule_name_ru, x, y}]`
        (`greenplan/explain/builder.py`). Добавочное изменение — необязательное поле `checks`
        у элемента: проверки отступов с расстоянием, посчитанным бэкендом. Пока его нет,
        фронтенд выводит проверки сам из `/zones` (и из `/obstacles`, когда он появится).

        Возможность: `explanationChecks`.
      operationId: get_explanation
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: По записи на каждую точку из `/planting`.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ExplanationEntry'
        '404':
          $ref: '#/components/responses/ResultNotReady'

  /projects/{project_id}/obstacles:
    get:
      summary: Распознанные объекты подосновы
      description: |
        Новый эндпоинт. Объекты из `processed/parsed.geojson` — того же файла, который бэкенд
        уже пишет после разбора (`greenplan/api/jobs.py`), в той же системе координат, что
        `/zones`: WGS84 при геопривязке, иначе координаты чертежа. Отдаются все объекты
        с категорией; фронтенд сам берёт категории, для которых есть нормы.

        Без путей сервера: `metadata.root_file`, `metadata.source_folder` и
        `properties.source_file` из `parsed.geojson` в ответ не попадают.

        Отдаётся и у проекта, упавшего на этапе геопривязки (`insufficient_geodetic_points`,
        `georeference_service_error`): подоснова уже разобрана, объекты — в координатах чертежа.
        По границе работ (`category: site_boundary`) фронтенд строит контур для ручной привязки
        (`PUT /georeference`). По решению бэкенда `parsed.geojson` пишется после геопривязки
        (`greenplan/api/jobs.py:293-317`): у проекта, упавшего на ней, ответ 404, и контур
        пользователь загружает файлом. У проекта, упавшего раньше разбора, — тоже 404.

        Возможность: `obstacles`.
      operationId: get_obstacles
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: GeoJSON FeatureCollection.
          content:
            application/geo+json:
              schema:
                $ref: '#/components/schemas/ObstaclesFeatureCollection'
        '404':
          $ref: '#/components/responses/ResultNotReady'

  /projects/{project_id}/rejected:
    get:
      summary: Отклонённые места посадки
      description: |
        Новый эндпоинт. Места-кандидаты, которые правило посадки рассматривало, но не заняло
        из-за нормативного отступа: точка внутри допустимой области `base_area`
        (газон ∩ граница участка), но вне `allowed` своего типа посадки. Кандидаты вне
        `base_area` не отдаются: `allowed.contains` в `greenplan/layout/engine.py:71,103`
        ложен и для них (вторая сторона борта — проезжая часть, сетка заполнения — по охвату
        участка), но это не отклонение по норме, и непройденных проверок у них нет. Сейчас
        раскладка такие места не сохраняет; не путать с зонами запрета из `/zones`.

        Возможность: `rejected`.
      operationId: get_rejected
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: GeoJSON FeatureCollection точек.
          content:
            application/geo+json:
              schema:
                $ref: '#/components/schemas/RejectedSitesFeatureCollection'
        '404':
          $ref: '#/components/responses/ResultNotReady'

  /norms:
    get:
      summary: Справочник норм
      description: |
        Новый эндпоинт. Записи `greenplan/norms/default.yaml` с сопоставленными пунктами
        нормативных актов — по записи на пару «объект + тип посадки». Сопоставление пунктов — в
        `contracts/norms-verified.md` фронтенда (акт, пункт, таблица, строка, значения и URL
        первоисточника). Где пункт для типа посадки подтвердить не удалось, `clause` — `null`:
        фронтенд показывает норму без пункта.

        Возможность: `norms`.
      operationId: get_norms
      responses:
        '200':
          description: Нормы отступов.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Norm'

  /species:
    get:
      summary: Справочник пород
      description: |
        Новый эндпоинт. Породы деревьев и кустарников из ассортимента для озеленения Москвы
        с параметрами кроны и корневой системы. Каждая запись ссылается на источник данных
        (`source`). Проверенный фронтендом справочник — `contracts/species-verified.md`.

        Возможность: `species`.
      operationId: get_species
      responses:
        '200':
          description: Породы.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Species'

  /projects/{project_id}/plantings:
    get:
      summary: Версии плана посадок
      description: |
        Модель бэкенд-разработчика. Версия 1 (`kind: auto`) — расстановка обработки; каждая
        правка создаёт следующую версию (`kind: manual`) на основе правленой. История линейная
        по номерам: `based_on` показывает, от какой версии сделана правка, и она может быть
        не последней. Версии не удаляются и не меняются.

        Новая обработка (`upload`, `/runs`, `PUT /georeference`) начинает историю заново:
        прежние версии относятся к прошлой расстановке.

        Список — по возрастанию `id`. 404 — только «нет проекта или результата».

        Возможность: `plantingEdits`.
      operationId: list_planting_versions
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: Версии, первая — расстановка обработки.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PlantingVersion'
        '404':
          $ref: '#/components/responses/ResultNotReady'

  /projects/{project_id}/plantings/{version}:
    get:
      summary: Посадки версии
      description: |
        Формат `/planting` и добавочно `origin` у каждой посадки. Координаты — в той же системе,
        что `/planting` (метка в `metadata.crs`).

        `id` посадок версии 1 устойчивы: во всех следующих версиях у той же посадки тот же `id`,
        даже если её переместили. У добавленной вручную `id` выдаёт сервер, `rule_id` — `null`.

        Возможность: `plantingEdits`.
      operationId: get_planting_version
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/PlantingVersionId'
      responses:
        '200':
          description: Посадки версии.
          content:
            application/geo+json:
              schema:
                $ref: '#/components/schemas/PlantingVersionFeatureCollection'
        '404':
          description: Нет проекта, результата или такой версии.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /projects/{project_id}/plantings/{version}/edit:
    post:
      summary: Правка версии — новая версия
      description: |
        Создаёт новую версию на основе `{version}`: её посадки, к которым применены удаления,
        перемещения и добавления. Правится любая версия, не только последняя; новая получает
        следующий номер, `based_on` — `{version}`. Одновременные правки не конфликтуют: каждая
        создаёт свою версию.

        - `delete` — `id` посадок правленой версии;
        - `update` — новая точка посадки правленой версии. Посадка версии 1, которой в правленой
          версии нет (удалена раньше), этим же способом возвращается в указанную точку со своим
          `id`, типом и правилом;
        - `add` — новая посадка; `plant_type` обязателен. `client_id` — идентификатор клиента: по
          нему клиент находит посадку в ответе, сервер его не хранит.

        Порядок применения: `delete`, `update`, `add`. Один `id` в двух списках — 422. Пустая
        правка (все три списка пусты) — 422: версия без изменений не нужна.

        `origin: manual` получают добавленные и перемещённые; перемещённая сохраняет `rule_id`.
        Порода и статус нормы в API версий не входят: сервер правки не перепроверяет, статусы
        считает клиент.

        Координаты — в системе `/planting` той же обработки: WGS84 при геопривязке, иначе метры
        чертежа (`lon`, `lat`). Кроме них клиент присылает точку в метрах чертежа (`x`, `y`) — ею
        сервер пишет посадку в DXF версии, не пересчитывая: обратного преобразования WGS84 →
        чертёж на сервере нет, а параметры привязки после обработки не сохраняются
        (`greenplan/api/jobs.py:83-86`). Клиент считает `x`, `y` подобием «план → чертёж»,
        подогнанным по неизменённым посадкам: у них есть и точка `/planting`, и точка чертежа
        `/explanation`. Подгонка принимается при трёх и более парах и RMS не больше 1 см;
        иначе клиент правку не отправляет. Без геопривязки `x`, `y` совпадают с `lon`, `lat`.

        Возможность: `plantingEdits`.
      operationId: edit_planting_version
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/PlantingVersionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlantingEdit'
      responses:
        '201':
          description: Версия создана.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlantingVersionCreated'
        '404':
          description: |
            Нет проекта, результата или такой версии. Во время новой обработки результата нет —
            тоже 404, как у остальных эндпоинтов результата.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/ValidationError'

  /projects/{project_id}/georeference:
    put:
      summary: Задать геопривязку готовыми параметрами
      description: |
        Новый эндпоинт. Клиент передаёт параметры подобия «чертёж → местность», найденные
        вручную или по опорным точкам, вместо запроса к geobridge. Проект переобрабатывается
        с этой привязкой: результаты (`/zones`, `/planting`, `/obstacles`) — в WGS84.

        Поворот задан от истинного севера, против часовой стрелки, вокруг опорной точки.
        Пересчёт к сетке UTM (зона — по долготе опорной точки) и сближение меридианов —
        на стороне сервера. Масштаб — метров местности в метре чертежа после
        `scale_to_meters`, обычно около 1.

        Ответ 202: проект снова в обработке (`queued`), как после `upload`. Параметры привязки
        сохраняются в `job.georeference` и участвуют в экспорте DXF и правках посадок. Параметры
        обработки и `root_dxf` последнего запуска (`/runs`) сохраняются: привязка меняет только
        геопривязку, а не выбор главного чертежа.

        Возможность: `manualGeoreference`.
      operationId: put_georeference
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManualGeoreference'
      responses:
        '202':
          description: Привязка принята, проект в обработке.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        '404':
          $ref: '#/components/responses/ProjectNotFound'
        '409':
          description: Архив ещё не загружен или идёт обработка.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/ValidationError'

  /projects/{project_id}/zones:
    get:
      summary: Зоны разрешённой и запрещённой посадки
      description: Описывает текущий вывод `greenplan/export/zones.py`; формат не меняется.
      operationId: get_zones
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: GeoJSON FeatureCollection.
          content:
            application/geo+json:
              schema:
                $ref: '#/components/schemas/ZonesFeatureCollection'
        '404':
          $ref: '#/components/responses/ResultNotReady'

  /projects/{project_id}/planting:
    get:
      summary: Точки посадок
      description: |
        Описывает текущий вывод `greenplan/export/planting.py`. Добавочно у посадки — порода
        `species_id` и причина её выбора `species_reason_ru` (возможность `species`).

        С версиями плана посадок (возможность `plantingEdits`) — последняя версия в этом же
        формате: у добавленных вручную `rule_id` — `null`. Клиент, который не знает о версиях,
        видит последний план.
      operationId: get_planting
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: GeoJSON FeatureCollection.
          content:
            application/geo+json:
              schema:
                $ref: '#/components/schemas/PlantingFeatureCollection'
        '404':
          $ref: '#/components/responses/ResultNotReady'

  /projects/{project_id}/dxf:
    get:
      summary: Скачать DXF с результатом
      description: |
        Главный DXF архива плюс слой `GREENING_PROPOSED`. Сейчас спецификация указывает
        `application/json`, а бэкенд отдаёт файл.

        Добавочно (возможность `editedDxf`): `?version={version}` — слой посадок этой версии
        плана посадок, по точкам чертежа `x`, `y` версии. Без параметра — последняя версия, как
        `/planting`.
      operationId: get_dxf
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: version
          in: query
          required: false
          description: Номер версии плана посадок; 404 — такой версии нет.
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: DXF-файл.
          headers:
            Content-Disposition:
              description: |
                Изменение: `attachment; filename="planting.dxf"; filename*=UTF-8''<имя>.dxf`
                (RFC 6266, RFC 5987). `filename*` нужен для кириллицы в имени проекта; `filename` —
                ASCII-запасной вариант. Сейчас бэкенд отдаёт только `filename="planting.dxf"`.
              schema:
                type: string
          content:
            application/dxf:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/ResultNotReady'

  /processing-defaults:
    get:
      summary: Параметры обработки по умолчанию
      description: |
        Значения — из `greenplan/layout/default.yaml`. Диапазоны `min`/`max` — предложение
        фронтенда; бэкенд утверждает их и проверяет по ним `RunRequest` (иначе 422).
      operationId: get_processing_defaults
      responses:
        '200':
          description: Параметры по умолчанию.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessingDefaults'

components:
  parameters:
    ProjectId:
      name: project_id
      in: path
      required: true
      schema:
        type: string

    PlantingVersionId:
      name: version
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
  responses:
    ProjectNotFound:
      description: Проекта нет или он удалён.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ResultNotReady:
      description: |
        Проекта нет, или результат ещё не готов (статус не `ready`). `detail` различается
        («Project not found» и «Project data not available yet (status: …)»), но это текст, а не
        контракт: фронтенд опирается на статус проекта.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooManyJobs:
      description: Все слоты обработки заняты. Повторить позже.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationError:
      description: Ошибка валидации тела (стандартный ответ FastAPI).
      content:
        application/json:
          schema:
            $ref: 'https://backend.greenleaders.online/openapi.json#/components/schemas/HTTPValidationError'

  schemas:
    ErrorResponse:
      type: object
      description: Тело всех ошибок, кроме 422 (`HTTPException` FastAPI).
      required: [detail]
      properties:
        detail:
          type: string
          description: Техническое сообщение на английском. Пользователю не показывается.

    PlantType:
      type: string
      enum: [tree, shrub]

    ProjectStatus:
      type: string
      description: |
        Статус проекта; совпадает с `job.stage`. Значения — из `greenplan/api/jobs.py`.
        `draft` — архив не загружен. `queued`…`exporting` — обработка идёт, `georeferencing`
        только при заданном `bbox_user`. `ready` и `failed` — финальные.
        Переходы: draft → queued → extracting → parsing → [georeferencing] → zoning_layout →
        exporting → ready; с любого этапа — в failed; из failed и ready — снова в queued
        (upload из failed, runs из ready и failed).
      enum:
        - draft
        - queued
        - extracting
        - parsing
        - georeferencing
        - zoning_layout
        - exporting
        - ready
        - failed

    ProjectCreateRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
          description: |
            Изменение: 1–120 символов после обрезки пробелов по краям. Строка из одних
            пробелов отклоняется с 422.
        description:
          type: [string, 'null']
          maxLength: 1000
          description: 'Изменение: необязательное описание, до 1000 символов.'
        bbox_user:
          description: |
            Изменение: необязателен. Примерные границы участка
            `[min_lon, min_lat, max_lon, max_lat]` в WGS84. Без него этап `georeferencing`
            пропускается, а `zones`, `planting`, `obstacles` и `rejected` остаются в локальных
            координатах чертежа (так бэкенд уже поступает с проектами без bbox).
          type: [array, 'null']
          prefixItems:
            - type: number
            - type: number
            - type: number
            - type: number
          minItems: 4
          maxItems: 4

    JobStatus:
      type: object
      description: Изменение — `stage` перечислением.
      required: [stage, progress_pct]
      properties:
        stage:
          $ref: '#/components/schemas/ProjectStatus'
        progress_pct:
          type: integer
          description: 'По этапам: 0, 5, 10, 40, 70, 90, 100. У `failed` тоже 100.'
        error:
          anyOf:
            - $ref: 'https://backend.greenleaders.online/openapi.json#/components/schemas/JobError'
            - type: 'null'
        georeference:
          anyOf:
            - $ref: 'https://backend.greenleaders.online/openapi.json#/components/schemas/GeoreferenceInfo'
            - type: 'null'
        started_at:
          type: [string, 'null']
          format: date-time
          description: Время старта воркера; время в очереди сюда не входит.
        finished_at:
          type: [string, 'null']
          format: date-time

    ProjectResponse:
      type: object
      description: Изменение — `status` и `job.stage` перечислениями.
      required: [id, name, description, created_at, updated_at, status, job]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: [string, 'null']
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/ProjectStatus'
        job:
          $ref: '#/components/schemas/JobStatus'

    ExplanationEntry:
      type: object
      description: |
        Запись `/explanation` в текущем формате бэкенда. Допустимы новые свойства: клиенты
        их пропускают.
      required: [id, plant_type, rule_id, rule_name_ru, x, y]
      properties:
        id:
          type: string
          description: Как в `/planting` и в XDATA `GREENPLAN` DXF, например «TREE_ROW_CURB-00001».
        plant_type:
          $ref: '#/components/schemas/PlantType'
        rule_id:
          type: string
          description: Идентификатор правила из `layout/default.yaml`, например «TREE_ROW_CURB».
        rule_name_ru:
          type: [string, 'null']
        x:
          type: number
          description: |
            Координата чертежа, м — та же система, что у окружностей в DXF, и при геопривязке.
        y:
          type: number
          description: Координата чертежа, м.
        checks:
          type: array
          description: |
            Добавочное, необязательное. Проверки отступов от ближайших объектов — по одной на
            каждую пару «категория, подтип», для которой есть норма. У посадки все проверки
            пройдены: `actual_m >= required_m`.
          items:
            $ref: '#/components/schemas/ExplanationCheck'

    ExplanationCheck:
      type: object
      required: [category, subtype, required_m, actual_m, citation]
      properties:
        category:
          type: string
          description: Как `obstacle_category` в `/zones`, например `underground_utilities`.
        subtype:
          type: [string, 'null']
          description: Как `obstacle_subtype` в `/zones`; `null` у категорий без подтипа.
        required_m:
          type: number
          description: Нормативный отступ для этого типа посадки, м.
        actual_m:
          type: number
          description: |
            Расстояние от точки ствола до ближайшей точки объекта, м, посчитанное бэкендом
            в метрической системе обработки (UTM или чертёж), округлено до 0,01.
        citation:
          type: string
          description: Как `citation` в `/zones`, например «743-ПП — газопровод».
        norm_id:
          type: string
          description: |
            Ссылка на запись `/norms` (`Norm.id`) для типа этой посадки: у дерева —
            `…-tree`, у кустарника — `…-shrub`.

    ObstaclesFeatureCollection:
      type: object
      required: [type, metadata, features]
      properties:
        type:
          const: FeatureCollection
        metadata:
          allOf:
            - $ref: '#/components/schemas/CrsMetadata'
            - type: object
              properties:
                source_insunits:
                  type: integer
                  description: '`$INSUNITS` главного DXF, как в `parsed.geojson`.'
                scale_to_meters:
                  type: number
                  description: Множитель единиц чертежа в метры, как в `parsed.geojson`.
        features:
          type: array
          items:
            $ref: '#/components/schemas/ObstacleFeature'

    ObstacleFeature:
      type: object
      required: [type, geometry, properties]
      properties:
        type:
          const: Feature
        geometry:
          oneOf:
            - $ref: '#/components/schemas/PointGeometry'
            - $ref: '#/components/schemas/LineStringGeometry'
            - $ref: '#/components/schemas/MultiLineStringGeometry'
            - $ref: '#/components/schemas/PolygonGeometry'
            - $ref: '#/components/schemas/MultiPolygonGeometry'
        properties:
          type: object
          description: |
            Свойства — как в `parsed.geojson` (`greenplan/export/geojson.py`), кроме
            `source_file`: путь на сервере наружу не отдаётся.
          required: [rule_id, category, subtype, status, layer, dxftype, handle]
          properties:
            rule_id:
              type: string
              description: Правило распознавания из `rules/default.yaml`.
            category:
              type: string
              description: Как `obstacle_category` в `/zones`.
            subtype:
              type: [string, 'null']
              description: Как `obstacle_subtype` в `/zones`.
            status:
              type: string
              description: Статус правила распознавания, например `auto`, `proxy_low_confidence`.
            layer:
              type: string
              description: Слой исходного DXF.
            dxftype:
              type: string
              description: Тип сущности DXF, например `LWPOLYLINE`, `INSERT`.
            label:
              type: string
              description: Подпись геодезического пункта; только у `geodetic_points`.
            elevation:
              type: number
              description: Отметка горизонтали; только у `contours`.
            handle:
              type: [string, 'null']
              description: |
                Handle сущности DXF. `null` для сущностей из xref и взорванных блоков — у них
                нет handle (`greenplan/model.py`, `Feature.handle`).

    RejectedSitesFeatureCollection:
      type: object
      required: [type, metadata, features]
      properties:
        type:
          const: FeatureCollection
        metadata:
          $ref: '#/components/schemas/CrsMetadata'
        features:
          type: array
          items:
            $ref: '#/components/schemas/RejectedSite'

    RejectedSite:
      type: object
      required: [type, geometry, properties]
      properties:
        type:
          const: Feature
        geometry:
          $ref: '#/components/schemas/PointGeometry'
        properties:
          type: object
          required: [plant_type, rule_id, failed_checks]
          properties:
            plant_type:
              $ref: '#/components/schemas/PlantType'
            rule_id:
              type: string
            failed_checks:
              type: array
              description: Непройденные проверки (`actual_m < required_m`).
              minItems: 1
              items:
                $ref: '#/components/schemas/ExplanationCheck'

    Norm:
      type: object
      description: |
        Норма для пары «объект + тип посадки»: у дерева и кустарника разные значения, пункты и
        подтверждённость. Одна строка `greenplan/norms/default.yaml` (`tree_m`, `shrub_m`) даёт
        две записи.
      required:
        [
          id,
          obstacle_category,
          obstacle_subtype,
          plant_type,
          distance_m,
          basis,
          citation,
          act,
          clause,
          text,
          source_url,
        ]
      properties:
        id:
          type: string
          description: |
            Постоянный идентификатор, например `743-pp-gas-tree`; на него ссылается `norm_id`
            проверки посадки того же типа.
        obstacle_category:
          type: string
        obstacle_subtype:
          type: [string, 'null']
        plant_type:
          $ref: '#/components/schemas/PlantType'
        distance_m:
          type: number
          description: Отступ для этого типа посадки, м (`tree_m` или `shrub_m` из `default.yaml`).
        basis:
          $ref: '#/components/schemas/NormBasis'
        citation:
          type: string
          description: Строка как в `/zones`, например «743-ПП — газопровод».
        act:
          type: [string, 'null']
          description: |
            Акт, например «ПП Москвы от 10.09.2002 № 743-ПП, прил. 1»; `null`, если значение —
            собственное решение сервиса и в нормативных актах строки нет.
        clause:
          type: [string, 'null']
          description: |
            Пункт, таблица и строка таблицы для этого типа посадки. `null`, если значение сервиса
            для этого типа первоисточником не подтверждено (например, в таблице у кустарника
            прочерк): фронтенд показывает норму без пункта.
        text:
          type: string
          description: |
            Текст нормы для этого типа посадки по-русски. При `basis: service_default` — почему
            значение не из акта, например «Для кустарника у газопровода норма в ПП № 743-ПП,
            табл. 3.6.1, не установлена».
        source_url:
          type: [string, 'null']
          description: Адрес первоисточника (docs.cntd.ru, base.garant.ru); `null`, если не найден.

    NormBasis:
      type: string
      enum: [regulation, service_default]
      description: |
        Основание отступа: `regulation` — значение из нормативного акта (`act` и `clause`);
        `service_default` — консервативное значение сервиса, в акте нормы для этого объекта и типа
        посадки нет (прочерк в таблице или строки нет вовсе). Такой отступ не показывается как
        требование акта.

    Species:
      type: object
      required: [id, name_ru, name_lat, plant_type, crown_diameter_m, height_m, root_system, source]
      properties:
        id:
          type: string
          description: Постоянный идентификатор, например `tilia_cordata`.
        name_ru:
          type: string
          description: Название по-русски, например «Липа мелколистная».
        name_lat:
          type: string
          description: Латинское название, например «Tilia cordata».
        plant_type:
          $ref: '#/components/schemas/PlantType'
        crown_diameter_m:
          type: [number, 'null']
          description: |
            Типичный диаметр кроны взрослого растения, м; `null`, если источник его не даёт.
            Не выдумывается: от него зависит правило выбора породы.
        height_m:
          type: number
          description: Типичная высота взрослого растения, м.
        root_system:
          type: [string, 'null']
          enum: [shallow, deep, mixed, null]
          description: |
            Корневая система — поверхностная, глубокая (стержневая) или смешанная; `null`, если
            источник её не называет.
        source:
          type: string
          description: Откуда данные о породе — документ или справочник, лучше с адресом.

    PlantingOrigin:
      type: string
      enum: [auto, manual]
      description: '`auto` — точка расстановки обработки, `manual` — добавлена или перемещена пользователем.'

    PlantingVersion:
      type: object
      required: [id, name, kind, created_at, based_on, planting_count]
      properties:
        id:
          type: integer
          minimum: 1
          description: Номер версии; 1 — расстановка обработки.
        name:
          type: [string, 'null']
          maxLength: 200
          description: Имя, которое дал автор правки; у версии обработки — `null`.
        kind:
          type: string
          enum: [auto, manual]
          description: '`auto` — расстановка обработки, `manual` — правка пользователя.'
        created_at:
          type: string
          format: date-time
        based_on:
          type: [integer, 'null']
          description: Версия, на основе которой сделана правка; у версии обработки — `null`.
        planting_count:
          type: integer
          minimum: 0

    PlantingVersionCreated:
      allOf:
        - $ref: '#/components/schemas/PlantingVersion'
        - type: object
          required: [added_ids]
          properties:
            added_ids:
              type: object
              additionalProperties:
                type: string
              description: '`client_id` из `add` → `id`, который сервер выдал посадке.'

    PlantingVersionFeatureCollection:
      type: object
      required: [type, metadata, features]
      properties:
        type:
          const: FeatureCollection
        metadata:
          allOf:
            - $ref: '#/components/schemas/CrsMetadata'
            - type: object
              required: [version]
              properties:
                version:
                  type: integer
        features:
          type: array
          items:
            $ref: '#/components/schemas/PlantingVersionFeature'

    PlantingVersionFeature:
      type: object
      required: [type, geometry, properties]
      properties:
        type:
          const: Feature
        geometry:
          $ref: '#/components/schemas/PointGeometry'
        properties:
          type: object
          required: [id, plant_type, rule_id, origin, x, y]
          properties:
            id:
              type: string
            plant_type:
              $ref: '#/components/schemas/PlantType'
            rule_id:
              type: [string, 'null']
              description: Правило посадки; у добавленной вручную — `null`.
            x:
              type: number
              description: |
                X чертежа, м: у посадки обработки — как в `/explanation`, у правленой — присланный
                клиентом. Ею посадка записана в DXF версии.
            y:
              type: number
              description: Y чертежа, м — как `x`.
            origin:
              $ref: '#/components/schemas/PlantingOrigin'
            species_id:
              type: [string, 'null']
              description: Как в `/planting` (возможность `species`); правка породу не меняет.
            species_reason_ru:
              type: [string, 'null']

    PlantingEdit:
      type: object
      required: [add, update, delete]
      properties:
        name:
          type: [string, 'null']
          maxLength: 200
          description: Имя новой версии; пустая строка — как `null`.
        add:
          type: array
          items:
            type: object
            required: [client_id, lon, lat, x, y, plant_type]
            properties:
              client_id:
                type: string
                maxLength: 64
              lon:
                type: number
                description: Долгота или X чертежа — в системе `/planting`.
              lat:
                type: number
                description: Широта или Y чертежа — в системе `/planting`.
              x:
                type: number
                description: X чертежа, м — точка для DXF, считает клиент.
              y:
                type: number
                description: Y чертежа, м — точка для DXF, считает клиент.
              plant_type:
                $ref: '#/components/schemas/PlantType'
        update:
          type: array
          items:
            type: object
            required: [id, lon, lat, x, y]
            properties:
              id:
                type: string
              lon:
                type: number
              lat:
                type: number
              x:
                type: number
                description: X чертежа, м — точка для DXF, считает клиент.
              y:
                type: number
                description: Y чертежа, м — точка для DXF, считает клиент.
        delete:
          type: array
          items:
            type: string

    ManualGeoreference:
      type: object
      required: [anchor_wgs84, anchor_drawing, rotation_deg, scale, method, rms_m, control_points]
      properties:
        anchor_wgs84:
          type: object
          required: [lat, lon]
          properties:
            lat:
              type: number
            lon:
              type: number
          description: Опорная точка на местности, WGS84.
        anchor_drawing:
          type: object
          required: [x, y]
          properties:
            x:
              type: number
            y:
              type: number
          description: Та же точка в координатах чертежа, м (после `scale_to_meters`).
        rotation_deg:
          type: number
          description: Поворот чертежа от истинного севера, градусы, против часовой стрелки.
        scale:
          type: number
          exclusiveMinimum: 0
          description: Метров местности в метре чертежа.
        method:
          type: string
          enum: [manual, control_points]
          description: '`manual` — совмещение вручную; `control_points` — подгонка по опорным точкам.'
        rms_m:
          type: [number, 'null']
          description: Средняя квадратичная невязка по опорным точкам, м; `null` при ручном совмещении.
        control_points:
          type: array
          description: Опорные точки с невязками; пустой список при ручном совмещении.
          items:
            $ref: '#/components/schemas/ControlPoint'

    ControlPoint:
      type: object
      required: [drawing, wgs84, residual_m, used]
      properties:
        label:
          type: [string, 'null']
          description: Подпись пункта, если есть.
        drawing:
          type: object
          required: [x, y]
          properties:
            x:
              type: number
            y:
              type: number
        wgs84:
          type: object
          required: [lat, lon]
          properties:
            lat:
              type: number
            lon:
              type: number
        residual_m:
          type: number
          description: Невязка точки после подгонки, м.
        used:
          type: boolean
          description: Участвует в подгонке; `false` — контрольная точка.

    RunRequest:
      type: object
      description: Все поля необязательны; не заданное берётся из `GET /processing-defaults`.
      properties:
        root_dxf:
          type: string
          description: |
            Главный DXF — путь внутри архива, один из `job.error.candidates` после
            `ambiguous_root_dxf`. Не задан — определяется автоматически, как при upload.
            Путь не из архива — 422.
        plant_types:
          type: array
          description: Какие типы посадок размещать. По умолчанию все. Пустой список — 422.
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/PlantType'
        planting_rules:
          type: object
          description: |
            Переопределения правил посадки, ключ — `rule_id`. Неизвестный `rule_id`, значение
            вне диапазона из `/processing-defaults` или `offset_m` у правила без отступа — 422.
          additionalProperties:
            $ref: '#/components/schemas/PlantingRuleOverride'

    PlantingRuleOverride:
      type: object
      properties:
        spacing_m:
          type: number
          description: Шаг посадки и минимальное расстояние между посадками правила, м.
        offset_m:
          type: number
          description: Отступ ряда от бортового камня, м. Только для правил вдоль борта.

    ProcessingDefaults:
      type: object
      required: [plant_types, planting_rules]
      properties:
        plant_types:
          type: array
          items:
            $ref: '#/components/schemas/PlantType'
        planting_rules:
          type: object
          description: Ключ — `rule_id`; порядок правил важен, как в `layout/default.yaml`.
          additionalProperties:
            $ref: '#/components/schemas/PlantingRuleDefaults'
      example:
        plant_types: [tree, shrub]
        planting_rules:
          TREE_ROW_CURB:
            name_ru: Рядовая/аллейная посадка вдоль борта
            plant_type: tree
            spacing_m: { default: 6, min: 4, max: 12 }
            offset_m: { default: 2.2, min: 0.7, max: 5 }
          TREE_FILL_LAWN:
            name_ru: Групповая/одиночная посадка на свободном газоне
            plant_type: tree
            spacing_m: { default: 5, min: 4, max: 15 }
            offset_m: null
          SHRUB_HEDGE_CURB:
            name_ru: Живая изгородь вдоль борта
            plant_type: shrub
            spacing_m: { default: 1.5, min: 0.3, max: 3 }
            offset_m: { default: 0.8, min: 0.5, max: 3 }
          SHRUB_FILL_LAWN:
            name_ru: Групповая посадка кустарников на свободном газоне
            plant_type: shrub
            spacing_m: { default: 3, min: 1, max: 6 }
            offset_m: null

    PlantingRuleDefaults:
      type: object
      required: [name_ru, plant_type, spacing_m, offset_m]
      properties:
        name_ru:
          type: string
        plant_type:
          $ref: '#/components/schemas/PlantType'
        spacing_m:
          $ref: '#/components/schemas/NumberRange'
        offset_m:
          description: |
            `null` у правил заполнения газона (`placement: grid_fill`): отступ от борта у них
            не используется.
          anyOf:
            - $ref: '#/components/schemas/NumberRange'
            - type: 'null'

    NumberRange:
      type: object
      description: Значение по умолчанию и допустимый диапазон, м. `min`/`max` — предложение фронтенда.
      required: [default, min, max]
      properties:
        default:
          type: number
        min:
          type: number
        max:
          type: number

    PointGeometry:
      type: object
      required: [type, coordinates]
      properties:
        type:
          const: Point
        coordinates:
          type: array
          minItems: 2
          maxItems: 2
          items:
            type: number

    LineStringGeometry:
      type: object
      required: [type, coordinates]
      properties:
        type:
          const: LineString
        coordinates:
          type: array
          items:
            type: array
            items:
              type: number

    MultiLineStringGeometry:
      type: object
      required: [type, coordinates]
      properties:
        type:
          const: MultiLineString
        coordinates:
          type: array
          items:
            type: array
            items:
              type: array
              items:
                type: number

    PolygonGeometry:
      type: object
      required: [type, coordinates]
      properties:
        type:
          const: Polygon
        coordinates:
          type: array
          items:
            type: array
            items:
              type: array
              items:
                type: number

    MultiPolygonGeometry:
      type: object
      required: [type, coordinates]
      properties:
        type:
          const: MultiPolygon
        coordinates:
          type: array
          items:
            type: array
            items:
              type: array
              items:
                type: array
                items:
                  type: number

    CrsMetadata:
      type: object
      required: [crs]
      properties:
        crs:
          type: string
          description: |
            Метка системы координат геометрии. Без геопривязки —
            «local drawing coordinates, no geo-reference available», с геопривязкой —
            «EPSG:4326 (WGS84 lon/lat)» (`WGS84_CRS_LABEL`,
            ../backend/greenplan/georeference/apply.py:34).

    ZonesFeatureCollection:
      type: object
      required: [type, metadata, features]
      properties:
        type:
          const: FeatureCollection
        metadata:
          allOf:
            - $ref: '#/components/schemas/CrsMetadata'
            - type: object
              required: [used_site_boundary, uncovered_categories]
              properties:
                used_site_boundary:
                  type: boolean
                  description: '`false` — граница участка не найдена, взят весь газон.'
                uncovered_categories:
                  type: array
                  description: Категории объектов без нормы; отступ от них не строился.
                  items:
                    type: object
                    required: [category, subtype]
                    properties:
                      category:
                        type: string
                      subtype:
                        type: [string, 'null']
        features:
          type: array
          items:
            $ref: '#/components/schemas/ZoneFeature'

    ZoneFeature:
      type: object
      required: [type, geometry, properties]
      properties:
        type:
          const: Feature
        geometry:
          oneOf:
            - $ref: '#/components/schemas/PolygonGeometry'
            - $ref: '#/components/schemas/MultiPolygonGeometry'
        properties:
          oneOf:
            - $ref: '#/components/schemas/ExtentZoneProperties'
            - $ref: '#/components/schemas/AllowedZoneProperties'
            - $ref: '#/components/schemas/ProhibitedZoneProperties'

    ExtentZoneProperties:
      type: object
      description: Диагностические контуры — граница участка, газон и их пересечение.
      required: [zone_type]
      properties:
        zone_type:
          type: string
          enum: [site_boundary, lawn_raw, base_area]

    AllowedZoneProperties:
      type: object
      required: [zone_type, plant_type]
      properties:
        zone_type:
          const: allowed
        plant_type:
          $ref: '#/components/schemas/PlantType'

    ProhibitedZoneProperties:
      type: object
      description: Объединение отступов от всех объектов одного типа для одного типа посадки.
      required:
        [zone_type, plant_type, obstacle_category, obstacle_subtype, distance_m, citation, reason]
      properties:
        zone_type:
          const: prohibited
        plant_type:
          $ref: '#/components/schemas/PlantType'
        obstacle_category:
          type: string
        obstacle_subtype:
          type: [string, 'null']
        distance_m:
          type: number
        citation:
          type: string
          description: Строка из `norms/default.yaml`, например «743-ПП — газопровод».
        reason:
          type: string

    PlantingFeatureCollection:
      type: object
      required: [type, metadata, features]
      properties:
        type:
          const: FeatureCollection
        metadata:
          $ref: '#/components/schemas/CrsMetadata'
        features:
          type: array
          items:
            $ref: '#/components/schemas/PlantingFeature'

    PlantingFeature:
      type: object
      required: [type, geometry, properties]
      properties:
        type:
          const: Feature
        geometry:
          $ref: '#/components/schemas/PointGeometry'
        properties:
          type: object
          required: [id, plant_type, rule_id]
          properties:
            id:
              type: string
            plant_type:
              $ref: '#/components/schemas/PlantType'
            rule_id:
              type: [string, 'null']
              description: Изменение — `null` у добавленной вручную в последней версии плана посадок.
            species_id:
              type: [string, 'null']
              description: Добавочно (возможность `species`) — порода из `/species`.
            species_reason_ru:
              type: [string, 'null']
              description: |
                Добавочно — одна-две фразы, почему выбрана порода, по проверенному правилу:
                например «Корневая система поверхностная — подходит при близких сетях».
