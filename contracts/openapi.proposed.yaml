openapi: 3.1.0
info:
  title: greenplan API — контракт-предложение фронтенда
  version: 0.1.0-proposed
  description: |
    Эндпоинты и схемы, которых фронтенду не хватает в текущем API (коммит бэкенда 822709e).
    Здесь только новое и изменённое. Неизменные схемы подключены ссылкой на задеплоенную
    спецификацию https://backend.greenleaders.online/openapi.json.

    Принцип — только добавочные изменения. Существующие ответы не меняются: новые данные
    приходят новыми эндпоинтами или необязательными полями, а у объектов допустимы лишние
    свойства. Клиент, написанный под текущий API, продолжает работать; фронтенд подхватывает
    новое, когда оно появится.

    Что предлагается:
    - `GET /projects/{project_id}/obstacles` — главная просьба: распознанные объекты подосновы
      в той же системе координат, что `/zones` (источник — `processed/parsed.geojson`, который
      бэкенд уже пишет). По ним фронтенд считает точное расстояние от ствола до объекта
      для каждой проверки;
    - `GET /projects/{project_id}/explanation` — формат прежний, у элемента необязательное
      поле `checks` с расстояниями, посчитанными бэкендом;
    - `GET /projects/{project_id}/rejected` — места-кандидаты, отклонённые из-за отступа;
    - `GET /norms` — справочник норм из `norms/default.yaml`;
    - `POST /projects/{project_id}/runs` — повторная обработка загруженного архива с параметрами;
    - `GET /processing-defaults` — параметры обработки по умолчанию и допустимые диапазоны;
    - перечисления для `status`, `job.stage`; необязательный `bbox_user`; лимиты длины
      `name` и `description`; тело и коды ответов
      `upload`; файл в ответе `dxf`; схемы ответов `zones` и `planting` (описывают текущий вывод
      бэкенда, формат не меняется);
    - `ErrorResponse` для всех ошибок, кроме 422.

    Когда эндпоинт реализован, фронтенд удаляет его из этого файла и берёт типы из основной
    спецификации.

paths:
  /projects:
    post:
      summary: Создать проект
      description: |
        Изменения — `bbox_user` необязателен; у `name` и `description` появились ограничения
        длины (см. `ProjectCreateRequest`).
      operationId: create_project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectCreateRequest'
      responses:
        '201':
          description: Проект создан, статус `draft`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        '422':
          $ref: '#/components/responses/ValidationError'

  /projects/{project_id}/upload:
    post:
      summary: Загрузить архив и запустить обработку
      description: |
        Тело — сырые байты ZIP-архива, не multipart. Допустимо из статусов `draft` и `failed`.
        Лимит размера — `GREENPLAN_API_MAX_UPLOAD_MB` в МиБ: по умолчанию в коде 300 МиБ
        (314 572 800 байт), в docker-compose задано 100 МиБ (104 857 600 байт). Клиент по ТЗ
        ограничивает архив 100 МиБ независимо от сервера.
      operationId: upload_project
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: X-Upload-Filename
          in: header
          required: false
          description: |
            Исходное имя файла, закодированное `encodeURIComponent` (заголовок допускает только
            ASCII). Бэкенд может его не читать; сейчас его использует только мок фронтенда
            для детерминированных сценариев.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/zip:
            schema:
              type: string
              format: binary
      responses:
        '202':
          description: Архив принят, статус `queued`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        '400':
          description: Пустое тело.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/ProjectNotFound'
        '409':
          description: Статус проекта не позволяет загрузку (не `draft` и не `failed`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: |
            Архив больше лимита сервера: размер тела больше `GREENPLAN_API_MAX_UPLOAD_MB` · 2²⁰ байт
            (300 МиБ по умолчанию, 100 МиБ в docker-compose). Бэкенд обрывает приём посреди потока,
            поэтому клиент может получить обрыв соединения вместо ответа 413.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/TooManyJobs'

  /projects/{project_id}/runs:
    post:
      summary: Повторить обработку с параметрами
      description: |
        Перезапускает обработку уже загруженного архива. Результат прошлой обработки заменяется.
        Исходный архив не меняется. Все поля тела необязательны: пустой объект — повтор
        с параметрами по умолчанию (`GET /processing-defaults`).
      operationId: run_project
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunRequest'
      responses:
        '202':
          description: Перезапуск принят, статус `queued`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        '404':
          $ref: '#/components/responses/ProjectNotFound'
        '409':
          description: Статус не `ready` и не `failed`, или архив ещё не загружен.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyJobs'

  /projects/{project_id}/explanation:
    get:
      summary: Обоснование посадок
      description: |
        Формат прежний — массив `[{id, plant_type, rule_id, rule_name_ru, x, y}]`
        (`greenplan/explain/builder.py`). Добавочное изменение — необязательное поле `checks`
        у элемента: проверки отступов с расстоянием, посчитанным бэкендом. Пока его нет,
        фронтенд выводит проверки сам из `/zones` (и из `/obstacles`, когда он появится).
      operationId: get_explanation
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: По записи на каждую точку из `/planting`.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ExplanationEntry'
        '404':
          $ref: '#/components/responses/ResultNotReady'

  /projects/{project_id}/obstacles:
    get:
      summary: Распознанные объекты подосновы
      description: |
        Новый эндпоинт. Объекты из `processed/parsed.geojson` — того же файла, который бэкенд
        уже пишет после разбора (`greenplan/api/jobs.py`), в той же системе координат, что
        `/zones`: WGS84 при геопривязке, иначе координаты чертежа. Отдаются все объекты
        с категорией; фронтенд сам берёт категории, для которых есть нормы.

        Без путей сервера: `metadata.root_file`, `metadata.source_folder` и
        `properties.source_file` из `parsed.geojson` в ответ не попадают.
      operationId: get_obstacles
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: GeoJSON FeatureCollection.
          content:
            application/geo+json:
              schema:
                $ref: '#/components/schemas/ObstaclesFeatureCollection'
        '404':
          $ref: '#/components/responses/ResultNotReady'

  /projects/{project_id}/rejected:
    get:
      summary: Отклонённые места посадки
      description: |
        Новый эндпоинт. Места-кандидаты, которые правило посадки рассматривало, но не заняло
        из-за нормативного отступа: точка внутри допустимой области `base_area`
        (газон ∩ граница участка), но вне `allowed` своего типа посадки. Кандидаты вне
        `base_area` не отдаются: `allowed.contains` в `greenplan/layout/engine.py:71,103`
        ложен и для них (вторая сторона борта — проезжая часть, сетка заполнения — по охвату
        участка), но это не отклонение по норме, и непройденных проверок у них нет. Сейчас
        раскладка такие места не сохраняет; не путать с зонами запрета из `/zones`.
      operationId: get_rejected
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: GeoJSON FeatureCollection точек.
          content:
            application/geo+json:
              schema:
                $ref: '#/components/schemas/RejectedSitesFeatureCollection'
        '404':
          $ref: '#/components/responses/ResultNotReady'

  /norms:
    get:
      summary: Справочник норм
      description: |
        Новый эндпоинт. Записи `greenplan/norms/default.yaml`; `act`, `clause` и `text` —
        разбор `citation` («743-ПП — газопровод»). Номеров пунктов в источнике нет, поэтому
        `clause` сейчас `null`.
      operationId: get_norms
      responses:
        '200':
          description: Нормы отступов.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Norm'

  /projects/{project_id}/zones:
    get:
      summary: Зоны разрешённой и запрещённой посадки
      description: Описывает текущий вывод `greenplan/export/zones.py`; формат не меняется.
      operationId: get_zones
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: GeoJSON FeatureCollection.
          content:
            application/geo+json:
              schema:
                $ref: '#/components/schemas/ZonesFeatureCollection'
        '404':
          $ref: '#/components/responses/ResultNotReady'

  /projects/{project_id}/planting:
    get:
      summary: Точки посадок
      description: Описывает текущий вывод `greenplan/export/planting.py`; формат не меняется.
      operationId: get_planting
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: GeoJSON FeatureCollection.
          content:
            application/geo+json:
              schema:
                $ref: '#/components/schemas/PlantingFeatureCollection'
        '404':
          $ref: '#/components/responses/ResultNotReady'

  /projects/{project_id}/dxf:
    get:
      summary: Скачать DXF с результатом
      description: |
        Главный DXF архива плюс слой `GREENING_PROPOSED`. Сейчас спецификация указывает
        `application/json`, а бэкенд отдаёт файл.
      operationId: get_dxf
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: DXF-файл.
          headers:
            Content-Disposition:
              description: |
                Изменение: `attachment; filename="planting.dxf"; filename*=UTF-8''<имя>.dxf`
                (RFC 6266, RFC 5987). `filename*` нужен для кириллицы в имени проекта; `filename` —
                ASCII-запасной вариант. Сейчас бэкенд отдаёт только `filename="planting.dxf"`.
              schema:
                type: string
          content:
            application/dxf:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/ResultNotReady'

  /processing-defaults:
    get:
      summary: Параметры обработки по умолчанию
      description: |
        Значения — из `greenplan/layout/default.yaml`. Диапазоны `min`/`max` — предложение
        фронтенда; бэкенд утверждает их и проверяет по ним `RunRequest` (иначе 422).
      operationId: get_processing_defaults
      responses:
        '200':
          description: Параметры по умолчанию.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessingDefaults'

components:
  parameters:
    ProjectId:
      name: project_id
      in: path
      required: true
      schema:
        type: string

  responses:
    ProjectNotFound:
      description: Проекта нет или он удалён.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ResultNotReady:
      description: |
        Проекта нет, или результат ещё не готов (статус не `ready`). `detail` различается
        («Project not found» и «Project data not available yet (status: …)»), но это текст, а не
        контракт: фронтенд опирается на статус проекта.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooManyJobs:
      description: Все слоты обработки заняты. Повторить позже.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationError:
      description: Ошибка валидации тела (стандартный ответ FastAPI).
      content:
        application/json:
          schema:
            $ref: 'https://backend.greenleaders.online/openapi.json#/components/schemas/HTTPValidationError'

  schemas:
    ErrorResponse:
      type: object
      description: Тело всех ошибок, кроме 422 (`HTTPException` FastAPI).
      required: [detail]
      properties:
        detail:
          type: string
          description: Техническое сообщение на английском. Пользователю не показывается.

    PlantType:
      type: string
      enum: [tree, shrub]

    ProjectStatus:
      type: string
      description: |
        Статус проекта; совпадает с `job.stage`. Значения — из `greenplan/api/jobs.py`.
        `draft` — архив не загружен. `queued`…`exporting` — обработка идёт, `georeferencing`
        только при заданном `bbox_user`. `ready` и `failed` — финальные.
        Переходы: draft → queued → extracting → parsing → [georeferencing] → zoning_layout →
        exporting → ready; с любого этапа — в failed; из failed и ready — снова в queued
        (upload из failed, runs из ready и failed).
      enum:
        - draft
        - queued
        - extracting
        - parsing
        - georeferencing
        - zoning_layout
        - exporting
        - ready
        - failed

    ProjectCreateRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
          description: |
            Изменение: 1–120 символов после обрезки пробелов по краям. Строка из одних
            пробелов отклоняется с 422.
        description:
          type: [string, 'null']
          maxLength: 1000
          description: 'Изменение: необязательное описание, до 1000 символов.'
        bbox_user:
          description: |
            Изменение: необязателен. Примерные границы участка
            `[min_lon, min_lat, max_lon, max_lat]` в WGS84. Без него этап `georeferencing`
            пропускается, а `zones`, `planting`, `obstacles` и `rejected` остаются в локальных
            координатах чертежа (так бэкенд уже поступает с проектами без bbox).
          type: [array, 'null']
          prefixItems:
            - type: number
            - type: number
            - type: number
            - type: number
          minItems: 4
          maxItems: 4

    JobStatus:
      type: object
      description: Изменение — `stage` перечислением.
      required: [stage, progress_pct]
      properties:
        stage:
          $ref: '#/components/schemas/ProjectStatus'
        progress_pct:
          type: integer
          description: 'По этапам: 0, 5, 10, 40, 70, 90, 100. У `failed` тоже 100.'
        error:
          anyOf:
            - $ref: 'https://backend.greenleaders.online/openapi.json#/components/schemas/JobError'
            - type: 'null'
        georeference:
          anyOf:
            - $ref: 'https://backend.greenleaders.online/openapi.json#/components/schemas/GeoreferenceInfo'
            - type: 'null'
        started_at:
          type: [string, 'null']
          format: date-time
          description: Время старта воркера; время в очереди сюда не входит.
        finished_at:
          type: [string, 'null']
          format: date-time

    ProjectResponse:
      type: object
      description: Изменение — `status` и `job.stage` перечислениями.
      required: [id, name, description, created_at, updated_at, status, job]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: [string, 'null']
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/ProjectStatus'
        job:
          $ref: '#/components/schemas/JobStatus'

    ExplanationEntry:
      type: object
      description: |
        Запись `/explanation` в текущем формате бэкенда. Допустимы новые свойства: клиенты
        их пропускают.
      required: [id, plant_type, rule_id, rule_name_ru, x, y]
      properties:
        id:
          type: string
          description: Как в `/planting` и в XDATA `GREENPLAN` DXF, например «TREE_ROW_CURB-00001».
        plant_type:
          $ref: '#/components/schemas/PlantType'
        rule_id:
          type: string
          description: Идентификатор правила из `layout/default.yaml`, например «TREE_ROW_CURB».
        rule_name_ru:
          type: [string, 'null']
        x:
          type: number
          description: |
            Координата чертежа, м — та же система, что у окружностей в DXF, и при геопривязке.
        y:
          type: number
          description: Координата чертежа, м.
        checks:
          type: array
          description: |
            Добавочное, необязательное. Проверки отступов от ближайших объектов — по одной на
            каждую пару «категория, подтип», для которой есть норма. У посадки все проверки
            пройдены: `actual_m >= required_m`.
          items:
            $ref: '#/components/schemas/ExplanationCheck'

    ExplanationCheck:
      type: object
      required: [category, subtype, required_m, actual_m, citation]
      properties:
        category:
          type: string
          description: Как `obstacle_category` в `/zones`, например `underground_utilities`.
        subtype:
          type: [string, 'null']
          description: Как `obstacle_subtype` в `/zones`; `null` у категорий без подтипа.
        required_m:
          type: number
          description: Нормативный отступ для этого типа посадки, м.
        actual_m:
          type: number
          description: |
            Расстояние от точки ствола до ближайшей точки объекта, м, посчитанное бэкендом
            в метрической системе обработки (UTM или чертёж), округлено до 0,01.
        citation:
          type: string
          description: Как `citation` в `/zones`, например «743-ПП — газопровод».

    ObstaclesFeatureCollection:
      type: object
      required: [type, metadata, features]
      properties:
        type:
          const: FeatureCollection
        metadata:
          $ref: '#/components/schemas/CrsMetadata'
        features:
          type: array
          items:
            $ref: '#/components/schemas/ObstacleFeature'

    ObstacleFeature:
      type: object
      required: [type, geometry, properties]
      properties:
        type:
          const: Feature
        geometry:
          oneOf:
            - $ref: '#/components/schemas/PointGeometry'
            - $ref: '#/components/schemas/LineStringGeometry'
            - $ref: '#/components/schemas/MultiLineStringGeometry'
            - $ref: '#/components/schemas/PolygonGeometry'
            - $ref: '#/components/schemas/MultiPolygonGeometry'
        properties:
          type: object
          required: [category, subtype, layer, handle]
          properties:
            category:
              type: string
              description: Как `obstacle_category` в `/zones`.
            subtype:
              type: [string, 'null']
              description: Как `obstacle_subtype` в `/zones`.
            layer:
              type: string
              description: Слой исходного DXF.
            handle:
              type: [string, 'null']
              description: |
                Handle сущности DXF. `null` для сущностей из xref и взорванных блоков — у них
                нет handle (`greenplan/model.py`, `Feature.handle`).

    RejectedSitesFeatureCollection:
      type: object
      required: [type, metadata, features]
      properties:
        type:
          const: FeatureCollection
        metadata:
          $ref: '#/components/schemas/CrsMetadata'
        features:
          type: array
          items:
            $ref: '#/components/schemas/RejectedSite'

    RejectedSite:
      type: object
      required: [type, geometry, properties]
      properties:
        type:
          const: Feature
        geometry:
          $ref: '#/components/schemas/PointGeometry'
        properties:
          type: object
          required: [plant_type, rule_id, failed_checks]
          properties:
            plant_type:
              $ref: '#/components/schemas/PlantType'
            rule_id:
              type: string
            failed_checks:
              type: array
              description: Непройденные проверки (`actual_m < required_m`).
              minItems: 1
              items:
                $ref: '#/components/schemas/ExplanationCheck'

    Norm:
      type: object
      required: [obstacle_category, obstacle_subtype, tree_m, shrub_m, citation, act, clause, text]
      properties:
        obstacle_category:
          type: string
        obstacle_subtype:
          type: [string, 'null']
        tree_m:
          type: number
          description: Отступ для деревьев, м.
        shrub_m:
          type: number
          description: Отступ для кустарников, м.
        citation:
          type: string
          description: Строка как в `/zones`, например «743-ПП — газопровод».
        act:
          type: string
          description: Акт, например «743-ПП»; полное название — по решению бэкенда.
        clause:
          type: [string, 'null']
          description: |
            Пункт, таблица или строка таблицы. `null`, пока номеров пунктов в источнике нет:
            фронтенд не показывает пункт, которого нет.
        text:
          type: string
          description: Текст нормы по-русски, например «газопровод».

    RunRequest:
      type: object
      description: Все поля необязательны; не заданное берётся из `GET /processing-defaults`.
      properties:
        root_dxf:
          type: string
          description: |
            Главный DXF — путь внутри архива, один из `job.error.candidates` после
            `ambiguous_root_dxf`. Не задан — определяется автоматически, как при upload.
            Путь не из архива — 422.
        plant_types:
          type: array
          description: Какие типы посадок размещать. По умолчанию все. Пустой список — 422.
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/PlantType'
        planting_rules:
          type: object
          description: |
            Переопределения правил посадки, ключ — `rule_id`. Неизвестный `rule_id`, значение
            вне диапазона из `/processing-defaults` или `offset_m` у правила без отступа — 422.
          additionalProperties:
            $ref: '#/components/schemas/PlantingRuleOverride'

    PlantingRuleOverride:
      type: object
      properties:
        spacing_m:
          type: number
          description: Шаг посадки и минимальное расстояние между посадками правила, м.
        offset_m:
          type: number
          description: Отступ ряда от бортового камня, м. Только для правил вдоль борта.

    ProcessingDefaults:
      type: object
      required: [plant_types, planting_rules]
      properties:
        plant_types:
          type: array
          items:
            $ref: '#/components/schemas/PlantType'
        planting_rules:
          type: object
          description: Ключ — `rule_id`; порядок правил важен, как в `layout/default.yaml`.
          additionalProperties:
            $ref: '#/components/schemas/PlantingRuleDefaults'
      example:
        plant_types: [tree, shrub]
        planting_rules:
          TREE_ROW_CURB:
            name_ru: Рядовая/аллейная посадка вдоль борта
            plant_type: tree
            spacing_m: { default: 6, min: 4, max: 12 }
            offset_m: { default: 2.2, min: 0.7, max: 5 }
          TREE_FILL_LAWN:
            name_ru: Групповая/одиночная посадка на свободном газоне
            plant_type: tree
            spacing_m: { default: 5, min: 4, max: 15 }
            offset_m: null
          SHRUB_HEDGE_CURB:
            name_ru: Живая изгородь вдоль борта
            plant_type: shrub
            spacing_m: { default: 1.5, min: 0.3, max: 3 }
            offset_m: { default: 0.8, min: 0.5, max: 3 }
          SHRUB_FILL_LAWN:
            name_ru: Групповая посадка кустарников на свободном газоне
            plant_type: shrub
            spacing_m: { default: 3, min: 1, max: 6 }
            offset_m: null

    PlantingRuleDefaults:
      type: object
      required: [name_ru, plant_type, spacing_m, offset_m]
      properties:
        name_ru:
          type: string
        plant_type:
          $ref: '#/components/schemas/PlantType'
        spacing_m:
          $ref: '#/components/schemas/NumberRange'
        offset_m:
          description: |
            `null` у правил заполнения газона (`placement: grid_fill`): отступ от борта у них
            не используется.
          anyOf:
            - $ref: '#/components/schemas/NumberRange'
            - type: 'null'

    NumberRange:
      type: object
      description: Значение по умолчанию и допустимый диапазон, м. `min`/`max` — предложение фронтенда.
      required: [default, min, max]
      properties:
        default:
          type: number
        min:
          type: number
        max:
          type: number

    PointGeometry:
      type: object
      required: [type, coordinates]
      properties:
        type:
          const: Point
        coordinates:
          type: array
          minItems: 2
          maxItems: 2
          items:
            type: number

    LineStringGeometry:
      type: object
      required: [type, coordinates]
      properties:
        type:
          const: LineString
        coordinates:
          type: array
          items:
            type: array
            items:
              type: number

    MultiLineStringGeometry:
      type: object
      required: [type, coordinates]
      properties:
        type:
          const: MultiLineString
        coordinates:
          type: array
          items:
            type: array
            items:
              type: array
              items:
                type: number

    PolygonGeometry:
      type: object
      required: [type, coordinates]
      properties:
        type:
          const: Polygon
        coordinates:
          type: array
          items:
            type: array
            items:
              type: array
              items:
                type: number

    MultiPolygonGeometry:
      type: object
      required: [type, coordinates]
      properties:
        type:
          const: MultiPolygon
        coordinates:
          type: array
          items:
            type: array
            items:
              type: array
              items:
                type: array
                items:
                  type: number

    CrsMetadata:
      type: object
      required: [crs]
      properties:
        crs:
          type: string
          description: |
            Метка системы координат геометрии. Без геопривязки —
            «local drawing coordinates, no geo-reference available», с геопривязкой —
            «EPSG:4326 (WGS84 lon/lat)» (значение из теста бэкенда: сама константа
            `WGS84_CRS_LABEL` лежит в модуле `greenplan.georeference`, который не закоммичен).

    ZonesFeatureCollection:
      type: object
      required: [type, metadata, features]
      properties:
        type:
          const: FeatureCollection
        metadata:
          allOf:
            - $ref: '#/components/schemas/CrsMetadata'
            - type: object
              required: [used_site_boundary, uncovered_categories]
              properties:
                used_site_boundary:
                  type: boolean
                  description: '`false` — граница участка не найдена, взят весь газон.'
                uncovered_categories:
                  type: array
                  description: Категории объектов без нормы; отступ от них не строился.
                  items:
                    type: object
                    required: [category, subtype]
                    properties:
                      category:
                        type: string
                      subtype:
                        type: [string, 'null']
        features:
          type: array
          items:
            $ref: '#/components/schemas/ZoneFeature'

    ZoneFeature:
      type: object
      required: [type, geometry, properties]
      properties:
        type:
          const: Feature
        geometry:
          oneOf:
            - $ref: '#/components/schemas/PolygonGeometry'
            - $ref: '#/components/schemas/MultiPolygonGeometry'
        properties:
          oneOf:
            - $ref: '#/components/schemas/ExtentZoneProperties'
            - $ref: '#/components/schemas/AllowedZoneProperties'
            - $ref: '#/components/schemas/ProhibitedZoneProperties'

    ExtentZoneProperties:
      type: object
      description: Диагностические контуры — граница участка, газон и их пересечение.
      required: [zone_type]
      properties:
        zone_type:
          type: string
          enum: [site_boundary, lawn_raw, base_area]

    AllowedZoneProperties:
      type: object
      required: [zone_type, plant_type]
      properties:
        zone_type:
          const: allowed
        plant_type:
          $ref: '#/components/schemas/PlantType'

    ProhibitedZoneProperties:
      type: object
      description: Объединение отступов от всех объектов одного типа для одного типа посадки.
      required:
        [zone_type, plant_type, obstacle_category, obstacle_subtype, distance_m, citation, reason]
      properties:
        zone_type:
          const: prohibited
        plant_type:
          $ref: '#/components/schemas/PlantType'
        obstacle_category:
          type: string
        obstacle_subtype:
          type: [string, 'null']
        distance_m:
          type: number
        citation:
          type: string
          description: Строка из `norms/default.yaml`, например «743-ПП — газопровод».
        reason:
          type: string

    PlantingFeatureCollection:
      type: object
      required: [type, metadata, features]
      properties:
        type:
          const: FeatureCollection
        metadata:
          $ref: '#/components/schemas/CrsMetadata'
        features:
          type: array
          items:
            $ref: '#/components/schemas/PlantingFeature'

    PlantingFeature:
      type: object
      required: [type, geometry, properties]
      properties:
        type:
          const: Feature
        geometry:
          $ref: '#/components/schemas/PointGeometry'
        properties:
          type: object
          required: [id, plant_type, rule_id]
          properties:
            id:
              type: string
            plant_type:
              $ref: '#/components/schemas/PlantType'
            rule_id:
              type: string
